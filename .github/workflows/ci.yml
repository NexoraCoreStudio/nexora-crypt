name: Nexora Crypt - Windows
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Nexora.Crypt.Tests/Nexora.Crypt.Tests.csproj
      - name: Build
        run: dotnet build Nexora.Crypt.Tests/Nexora.Crypt.Tests.csproj -c Release --no-restore
      - name: Functional tests
        run: dotnet run --project Nexora.Crypt.Tests/Nexora.Crypt.Tests.csproj -c Release --no-build
